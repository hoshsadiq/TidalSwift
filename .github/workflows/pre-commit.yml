name: Pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    name: prek run --all-files
    # macOS because the SwiftLint hook needs a Swift toolchain (sourcekitdInProc).
    # Public repo — macOS runners are free.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup tools via mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Cache prek hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      # prek --all-files skips hidden dirs, so run actionlint explicitly on workflows.
      - name: Lint GitHub Actions workflows
        run: prek run actionlint --files .github/workflows/*.yml

      - name: Run prek (all hooks, all files)
        run: prek run --all-files
