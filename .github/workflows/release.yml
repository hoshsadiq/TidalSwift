name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Snapshot / Release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Prime Xcode
        run: sudo xcodebuild -runFirstLaunch

      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'TidalSwiftLib/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('project.yml', 'TidalSwiftLib/Package.resolved') }}
          restore-keys: dd-${{ runner.os }}-

      # Tags carry the version; main pushes use project values.
      - name: Derive version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        env:
          CONFIGURATION: Release
          MARKETING_VERSION: ${{ steps.ver.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.ver.outputs.build }}
        run: mise run build

      - name: Verify universal binary
        run: mise run verify-universal
        env:
          CONFIGURATION: Release

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            zip="TidalSwift.zip"
            hdiutil create -volname TidalSwift -srcfolder .build/DerivedData/Build/Products/Release/TidalSwift.app -ov -format UDZO TidalSwift.dmg
            dmg="TidalSwift.dmg"
          else
            zip="TidalSwift-snapshot-${GITHUB_SHA::7}.zip"
            dmg=""
          fi
          ditto -c -k --keepParent .build/DerivedData/Build/Products/Release/TidalSwift.app "$zip"
          {
            echo "zip=$zip"
            echo "dmg=$dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Upload snapshot artifact
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TidalSwift-snapshot-${{ github.run_number }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
          generate_release_notes: true

      # The app fetches this feed from the latest release's assets, not the repository.
      - name: Publish update feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.marketing }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          gh release view "$TAG" --json name,body,url,publishedAt > "$RUNNER_TEMP/release.json"

          title=$(jq -r '.name' "$RUNNER_TEMP/release.json")
          if [[ -z "$title" || "$title" == "null" ]]; then
            title="TidalSwift $VERSION"
          fi

          # UpdateNotification decodes the date as a bare number: seconds since
          # 2001-01-01, the same shape its own feed writer emits.
          published=$(jq -r '.publishedAt' "$RUNNER_TEMP/release.json")
          released_at=$(($(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$published" +%s) - 978307200))

          jq -n \
            --arg url "https://github.com/$GITHUB_REPOSITORY" \
            --arg version "$VERSION" \
            --arg build "$BUILD" \
            --argjson date "$released_at" \
            --arg title "$title" \
            --arg text "$(jq -r '.body' "$RUNNER_TEMP/release.json")" \
            --arg infoUrl "$(jq -r '.url' "$RUNNER_TEMP/release.json")" \
            --arg downloadUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/TidalSwift.zip" \
            '{
              url: $url,
              items: [
                {
                  version: $version,
                  build: $build,
                  date: $date,
                  title: $title,
                  text: $text,
                  minOSVersion: {majorVersion: 14, minorVersion: 0, patchVersion: 0},
                  infoUrl: $infoUrl,
                  downloadUrl: $downloadUrl
                }
              ]
            }' > TidalSwift.json

          gh release upload "$TAG" TidalSwift.json --clobber
