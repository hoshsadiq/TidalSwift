# Tools come from GitHub release backends (pinned versions).
[settings]
lockfile = true

[tools]
"github:realm/SwiftLint" = { version = "0.65.1", asset_pattern = "portable_swiftlint.zip" }
"github:j178/prek" = "0.5.2"
"github:rhysd/actionlint" = "1.7.12"
"github:RobotsAndPencils/xcodes" = { version = "2.0.3", asset_pattern = "xcodes.zip" }
"github:yonaskolb/XcodeGen" = "2.46.0"
"github:git-lfs/git-lfs" = "3.8.0"
"github:peripheryapp/periphery" = "3.8.0"
"github:mono0926/LicensePlist" = "3.28.0"
"github:cpisciotta/xcbeautify" = "3.2.1"
"npm:renovate" = { version = "44.65.2", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
