# Run with prek: prek run --all-files
default_install_hook_types: [pre-commit, post-checkout]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-xml
        files: '\.xcscheme$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: fix-byte-order-marker
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # - id: no-commit-to-branch
      #   args: [ --branch, main ]

  # - repo: https://github.com/gitleaks/gitleaks
  #   rev: v8.30.1
  #   hooks:
  #     - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.sh$|^mise/tasks/'

  # SwiftLint runs through mise so local and CI use the version pinned in mise.toml.
  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        language: system
        entry: mise exec -- swiftlint lint
        files: '\.swift$'

      # Regenerate the Xcode project after branch switches (per XcodeGen FAQ).
      # Enable with: prek install --hook-type post-checkout
      - id: xcodegen
        name: xcodegen generate
        language: system
        entry: mise exec -- xcodegen generate --use-cache
        stages: [ post-checkout ]
        pass_filenames: false
        always_run: true
